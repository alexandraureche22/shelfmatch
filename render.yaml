services:
  - type: web
    name: shelfmatch-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shelfmatch-db
          property: connectionString
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: shelfmatch-db
    plan: free